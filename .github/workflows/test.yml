name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  installer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # uma versão falhando não cancela a outra
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
